# Baut die PDF-Handbücher (deutsch und englisch) neu, sobald sich etwas in
# docs/ ändert, und legt sie wieder ins Repository. Anleitung:
# docs/HANDBUCH_BEARBEITEN.md
name: Handbuch-PDF bauen

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - '!docs/*.pdf'
  workflow_dispatch:   # von Hand: Actions -> Handbuch-PDF bauen -> Run workflow

permissions:
  contents: write

# Mehrere Änderungen kurz hintereinander: nacheinander bauen, nie parallel
concurrency:
  group: handbuch-pdf
  cancel-in-progress: false

jobs:
  pdf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # neuester Stand, auch nach einem vorherigen Bau

      - name: XeLaTeX und Schriften installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            texlive-xetex texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-lang-german fonts-dejavu lmodern

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pandoc installieren
        run: pip install -r docs/requirements.txt

      - name: PDFs bauen
        run: |
          python docs/build_pdf.py
          python docs/build_pdf.py en

      - name: PDFs ins Repository legen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898088+github-actions[bot]@users.noreply.github.com"
          git add docs/*.pdf
          git diff --cached --quiet && exit 0
          git commit -m "docs: Handbuch-PDFs automatisch neu gebaut"
          git push
